name: Security checks

on:
  pull_request:
  push:
    branches:
      - security/harden-auth-and-data-access

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: node --check server.js
      - run: npm test
